name: rinha-2026-italo

# Submission branch — references pre-built images on Docker Hub.
# Total budget: haproxy 0.15 + data-prep 0.05 + 2×api 0.40 = 1.00 CPU / 350 MB.
# IVF-F32 ANN (C=512 centroids), pure stdlib net/http.
# Adaptive nprobe (NPROBE=5 fast + NPROBE_DEEP=10 on borderline) — new best at +5101.19
# (#4561, 2026-05-15). Killed 1 FP and 1 FN; only 1 stubborn FN remains (fast pass
# returns nFraud=0 so deep never triggers). p99 5.23ms unchanged from 5→8.
# Local WSL: +5792 (vs +5775 at deep=12, +5757 at fast=4+deep=10).

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v1
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      NPROBE_DEEP: "10"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      NPROBE_DEEP: "10"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
