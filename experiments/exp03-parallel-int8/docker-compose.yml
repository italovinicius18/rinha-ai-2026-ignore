name: rinha-2026-exp03

# Clone of exp02 with GOMAXPROCS=2 — tests whether the Go runtime can
# exploit 2 simultaneous OS threads on the 0.45 CPU cgroup slice to reduce
# per-request latency via inter-request concurrency.
# Images are rebuilt from the exp02 Dockerfile (same binary, no code change).

services:
  data-prep:
    build:
      context: ../..
      dockerfile: experiments/exp02-brute-int8/Dockerfile
      target: data-prep
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    build:
      context: ../..
      dockerfile: experiments/exp02-brute-int8/Dockerfile
      target: api
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      GOMAXPROCS: "2"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"

  api2:
    build:
      context: ../..
      dockerfile: experiments/exp02-brute-int8/Dockerfile
      target: api
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      GOMAXPROCS: "2"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
