global
    maxconn 4096
    nbthread 1
    log stdout format raw local0 info

defaults
    mode http
    log global
    option dontlognull
    option http-keep-alive
    timeout connect 1s
    timeout client  5s
    timeout server  5s
    retries 1

frontend api_front
    bind *:9999
    default_backend api_back

backend api_back
    balance roundrobin
    option redispatch
    http-reuse always
    server api1 api1:8080 check inter 10s fall 2 rise 2
    server api2 api2:8080 check inter 10s fall 2 rise 2
