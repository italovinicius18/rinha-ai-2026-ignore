name: rinha-2026-exp16

# Budget: haproxy 0.10 + data-prep 0.05 + 2×api 0.425 = 1.00 CPU / 350 MB.
# IVF-F32 C=512 nprobe=8. HAProxy gets 0.10 CPU (was 0.05) to reduce CFS throttling.
# CFS throttle at 0.05 CPU (5ms/100ms period) was the ~170ms p99 root cause.
# http-reuse always + health check inter 10s to minimize HAProxy event-loop overhead.

services:
  data-prep:
    build:
      context: ../..
      dockerfile: experiments/exp16-haproxy-cpu/Dockerfile
      target: data-prep
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    build:
      context: ../..
      dockerfile: experiments/exp16-haproxy-cpu/Dockerfile
      target: api
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "8"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "155MB"

  api2:
    build:
      context: ../..
      dockerfile: experiments/exp16-haproxy-cpu/Dockerfile
      target: api
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "8"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
