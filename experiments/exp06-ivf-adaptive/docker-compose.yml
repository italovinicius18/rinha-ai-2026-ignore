name: rinha-2026-exp06

# Budget: haproxy 15 + data-prep 25 + 2×api 155 = 350 MB / 1 CPU.
# IVF C=512, adaptive two-pass search:
#   Fast path (NPROBE1=16): ~117 μs, confident results (0,1,4,5 frauds).
#   Fallback (NPROBE2=256): ~880 μs, triggered only for borderline 2 or 3.

services:
  data-prep:
    build:
      context: ../..
      dockerfile: experiments/exp06-ivf-adaptive/Dockerfile
      target: data-prep
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    build:
      context: ../..
      dockerfile: experiments/exp06-ivf-adaptive/Dockerfile
      target: api
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "16"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"

  api2:
    build:
      context: ../..
      dockerfile: experiments/exp06-ivf-adaptive/Dockerfile
      target: api
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "16"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
